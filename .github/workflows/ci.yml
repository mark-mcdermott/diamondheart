name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the run already going for that ref. Actions minutes
# are metered, and a stale run has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:unit

      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-test-secret

      - run: pnpm build:native

  # Isolation tests need a disposable Neon branch. Skipped without the secret
  # rather than silently passing, so a missing key is visible in the run.
  e2e:
    runs-on: ubuntu-latest
    # Normally ~4 minutes. A clone missing a column fails every test and, with
    # retries, would otherwise run toward GitHub's six-hour default.
    timeout-minutes: 15
    needs: verify
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for Neon credentials
        id: creds
        run: echo "present=${{ secrets.NEON_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.present != 'true'
        run: |
          echo "::warning::NEON_API_KEY is not set — skipping isolation tests."
          echo "Add NEON_API_KEY (and NEON_PROJECT_ID if the key sees several projects)."

      - if: steps.creds.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.creds.outputs.present == 'true'
        run: pnpm test:api
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

      - if: steps.creds.outputs.present == 'true'
        run: pnpm test:e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BETTER_AUTH_SECRET: ci-test-secret

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
